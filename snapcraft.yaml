name: sim-broadband-manager
adopt-info: sim-broadband-manager
summary: SIM Broadband Manager for modem status and network control
description: |
  Desktop application to manage broadband SIM modems, monitor connectivity,
  send SMS/USSD, make calls, and access SIM phonebook contacts using ModemManager.
base: core22
confinement: strict

apps:
  sim-broadband-manager:
    command: usr/local/bin/sim
    desktop: usr/share/applications/sim-broadband-manager.desktop
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - home
      - network
      - network-control
      - modem-manager
      - network-manager

parts:
  sim-broadband-manager:
    plugin: rust
    source: .
    source-type: git
    override-build: |
      snapcraftctl set-version "$(grep '"version":' sim/src-tauri/tauri.conf.json | head -n 1 | cut -d '"' -f 4)"
      cd sim/src-tauri
      cargo build --release
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/local/bin
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/applications
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps

      # Copy the binary
      cp target/release/sim $SNAPCRAFT_PART_INSTALL/usr/local/bin/

      # Copy desktop entry
      cp sim-broadband-manager.desktop $SNAPCRAFT_PART_INSTALL/usr/share/applications/

      # Copy icon (using 128x128 as fallback for 512x512)
      cp icons/128x128.png \
         $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/com.github.psychopods.sim_broadband_manager.png

    build-packages:
      - build-essential
      - libssl-dev
      - pkg-config
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - libappindicator3-dev
      - librsvg2-dev
      - patchelf
      - libsoup-3.0-dev
      - libglib2.0-dev
      - libjavascriptcoregtk-4.1-dev
      - libxdo-dev
      - git

    stage-packages:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
      - libappindicator3-1
      - libc6
      - libssl3
      - libglib2.0-0
      - libatk1.0-0
      - libpango-1.0-0
      - libgdk-pixbuf2.0-0
      - libsoup-3.0-0
      - libjavascriptcoregtk-4.1-0
      - libxdo3
      - libdconf1
      - gsettings-desktop-schemas
      - xdg-user-dirs
      - shared-mime-info
      - fontconfig-config
      - fonts-dejavu-core
